codecov:
  require_ci_to_pass: yes
  max_report_age: off
  disable_default_path_fixes: false
coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
        branches: null  # Allow all branches
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto
        branches: null  # Allow all branches
parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes  
      method: no
      macro: no
# Match SonarQube exclusions
ignore:
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.test.ts"  
  - "**/*.test.tsx"
  - "**/*.spec.js"
  - "**/*.spec.jsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/*.config.js"
  - "**/*.config.ts"
  - "**/public/**"
  - "**/stories/**"
  - "**/*.stories.*"
# Only include source files like SonarQube
fixes:
  - "src/::"
comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes
  branches: null  # Allow comments on all branches
github_checks:
  annotations: true
flags:
  unittests:
    paths:
      - src/
    ignore:
      - "src/**/*.test.*"
      - "src/**/*.spec.*"
      - "src/**/*.stories.*"