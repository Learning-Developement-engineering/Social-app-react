codecov:
  require_ci_to_pass: yes
  branch: main
  max_report_age: off

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
        branches:
          - main
          - develop
          - release.*
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes  
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes
  branches: null

github_checks:
  annotations: true

flags:
  unittests:
    paths:
      - src/